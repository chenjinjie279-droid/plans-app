<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b6ef5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self'">
  <title>计划表</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">📅 计划表</div>
    <nav class="tabs">
      <button class="tab active" data-tab="long">长期计划</button>
      <button class="tab" data-tab="short">每日计划</button>
    </nav>
    <div class="header-actions">
      <span id="saveState" class="save-state hidden"></span>
      <button id="btnExport" class="btn btn-ghost" title="把全部数据保存为一个 JSON 文件">导出备份</button>
      <button id="btnImport" class="btn btn-ghost" title="从 JSON 备份文件恢复数据">导入备份</button>
    </div>
  </header>

  <main>
    <!-- 长期计划 -->
    <section id="view-long" class="view active">
      <div class="view-toolbar">
        <div class="toolbar-info">
          <h2>长期计划</h2>
          <p class="hint">以「年」或「月」为时间单位 · 可勾选任务点标记完成进度 · 附带备注</p>
        </div>
        <button id="btnNewLong" class="btn btn-primary">+ 新建长期计划</button>
      </div>
      <div id="longList" class="card-list"></div>
      <div id="longEmpty" class="empty-tip hidden">还没有长期计划,点击右上角「+ 新建长期计划」开始吧</div>
    </section>

    <!-- 每日计划 -->
    <section id="view-short" class="view">
      <div class="view-toolbar">
        <div class="toolbar-info">
          <h2>每日计划</h2>
          <p class="hint">在日历上选择日期 · 查看以前的计划、制定以后的计划 · 每一天的计划一直保留、随时可修改</p>
        </div>
      </div>
      <div class="card calendar-card">
        <div class="calendar-nav">
          <button class="cal-nav-btn" data-nav="-1">‹ 上月</button>
          <span id="dailyCalTitle" class="cal-title"></span>
          <button class="cal-nav-btn" data-nav="1">下月 ›</button>
        </div>
        <div id="dailyCal" class="calendar"></div>
      </div>
      <div class="card plan-card">
        <div class="plan-card-head">
          <span id="dailyDateLabel" class="daily-date-label"></span>
        </div>
        <div id="dailyEmpty" class="empty-tip hidden">这一天还没有计划,点击下方「+ 添加计划」开始</div>
        <div id="dailyTasks" class="task-list"></div>
        <button id="btnAddDailyTask" class="btn btn-sm btn-add-task">+ 添加计划</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
